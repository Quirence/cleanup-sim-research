[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-sim-research"
version = "0.1.0"
description = "2D simulator for probabilistic floating-debris mapping and hybrid USV route planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["cleanup_sim*", "cleanup_sim_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
